<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Ярлыки на рабочем столе">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F6EF"/>
      <stop offset="1" stop-color="#E4E6D8"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2F3A2E" flood-opacity="0.14"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#6D7839" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <rect width="800" height="300" fill="url(#glow)"/>

  <!-- рабочий стол: сетка ярлыков 4 x 2 -->
  <g font-family="Ubuntu, Segoe UI, Arial, sans-serif" text-anchor="middle">

    <!-- 1. Почта -->
    <g filter="url(#sh)">
      <rect x="112" y="86" width="118" height="118" rx="24" fill="#FFFFFF"/>
      <rect x="136" y="118" width="70" height="48" rx="6" fill="#6D7839" opacity="0.14"/>
      <path d="M136 124 L171 150 L206 124" stroke="#6D7839" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="136" y="118" width="70" height="48" rx="6" stroke="#6D7839" stroke-width="4" fill="none"/>
    </g>
    <text x="171" y="232" font-size="19" fill="#3F4722" font-weight="700">Почта</text>

    <!-- 2. Портал ДИТ -->
    <g filter="url(#sh)">
      <rect x="262" y="86" width="118" height="118" rx="24" fill="#FFFFFF"/>
      <ellipse cx="321" cy="145" rx="27" ry="27" fill="none" stroke="#456CAB" stroke-width="4"/>
      <ellipse cx="321" cy="145" rx="12" ry="27" fill="none" stroke="#456CAB" stroke-width="3.5"/>
      <path d="M294 145 H348" stroke="#456CAB" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="321" y="232" font-size="19" fill="#3F4722" font-weight="700">Портал ДИТ</text>

    <!-- 3. Сетевой диск -->
    <g filter="url(#sh)">
      <rect x="412" y="86" width="118" height="118" rx="24" fill="#FFFFFF"/>
      <path d="M434 126 h26 l10 12 h32 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 h-68 a6 6 0 0 1 -6 -6 v-42 a6 6 0 0 1 6 -6 z"
            fill="#EEC145" opacity="0.9"/>
      <path d="M434 126 h26 l10 12 h32" fill="none" stroke="#C99A1E" stroke-width="3"/>
    </g>
    <text x="471" y="232" font-size="19" fill="#3F4722" font-weight="700">Сетевой диск</text>

    <!-- 4. Программы -->
    <g filter="url(#sh)">
      <rect x="562" y="86" width="118" height="118" rx="24" fill="#FFFFFF"/>
      <rect x="586" y="114" width="70" height="52" rx="7" fill="none" stroke="#528C54" stroke-width="4"/>
      <path d="M586 128 H656" stroke="#528C54" stroke-width="4"/>
      <circle cx="597" cy="121" r="3" fill="#528C54"/>
      <circle cx="608" cy="121" r="3" fill="#528C54"/>
    </g>
    <text x="621" y="232" font-size="19" fill="#3F4722" font-weight="700">Программы</text>

    <!-- 5. АИС ПИП -->
    <g filter="url(#sh)">
      <rect x="112" y="272" width="118" height="118" rx="24" fill="#FFFFFF"/>
      <rect x="136" y="300" width="70" height="46" rx="6" fill="#456CAB" opacity="0.14"/>
      <path d="M150 336 v-10 M162 336 v-18 M174 336 v-6 M186 336 v-14" stroke="#456CAB" stroke-width="4" stroke-linecap="round"/>
      <rect x="136" y="300" width="70" height="46" rx="6" stroke="#456CAB" stroke-width="3.5" fill="none"/>
    </g>
    <text x="171" y="418" font-size="19" fill="#3F4722" font-weight="700">АИС ПИП</text>

    <!-- 6. ЭДО -->
    <g filter="url(#sh)">
      <rect x="262" y="272" width="118" height="118" rx="24" fill="#FFFFFF"/>
      <rect x="296" y="298" width="50" height="64" rx="5" fill="none" stroke="#6D7839" stroke-width="4"/>
      <path d="M308 314 h26 M308 326 h26 M308 338 h16" stroke="#6D7839" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="321" y="418" font-size="19" fill="#3F4722" font-weight="700">ЭДО</text>

    <!-- 7. Облако -->
    <g filter="url(#sh)">
      <rect x="412" y="272" width="118" height="118" rx="24" fill="#FFFFFF"/>
      <path d="M447 348 a16 16 0 0 1 2 -32 a22 22 0 0 1 42 -4 a15 15 0 0 1 3 29 z" fill="#528C54" opacity="0.9"/>
    </g>
    <text x="471" y="418" font-size="19" fill="#3F4722" font-weight="700">Облако</text>

    <!-- 8. Принтер -->
    <g filter="url(#sh)">
      <rect x="562" y="272" width="118" height="118" rx="24" fill="#FFFFFF"/>
      <rect x="590" y="310" width="62" height="26" rx="5" fill="none" stroke="#525A2B" stroke-width="4"/>
      <rect x="582" y="336" width="78" height="30" rx="6" fill="#6D7839" opacity="0.85"/>
      <rect x="598" y="352" width="46" height="18" rx="3" fill="#FFFFFF"/>
    </g>
    <text x="621" y="418" font-size="19" fill="#3F4722" font-weight="700">Принтер</text>

    <!-- значок «ярлык» на каждом элементе -->
    <g opacity="0.9">
      <g fill="#FFFFFF" stroke="#9AA171" stroke-width="2">
        <rect x="196" y="176" width="30" height="30" rx="7"/><rect x="346" y="176" width="30" height="30" rx="7"/>
        <rect x="496" y="176" width="30" height="30" rx="7"/><rect x="646" y="176" width="30" height="30" rx="7"/>
        <rect x="196" y="362" width="30" height="30" rx="7"/><rect x="346" y="362" width="30" height="30" rx="7"/>
        <rect x="496" y="362" width="30" height="30" rx="7"/><rect x="646" y="362" width="30" height="30" rx="7"/>
      </g>
      <g stroke="#6D7839" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M203 197 l8 -8 M204 189 h7 v7"/><path d="M353 197 l8 -8 M354 189 h7 v7"/>
        <path d="M503 197 l8 -8 M504 189 h7 v7"/><path d="M653 197 l8 -8 M654 189 h7 v7"/>
        <path d="M203 383 l8 -8 M204 375 h7 v7"/><path d="M353 383 l8 -8 M354 375 h7 v7"/>
        <path d="M503 383 l8 -8 M504 375 h7 v7"/><path d="M653 383 l8 -8 M654 375 h7 v7"/>
      </g>
    </g>
  </g>

  <!-- панель задач -->
  <rect x="0" y="544" width="800" height="56" fill="#FFFFFF" opacity="0.55"/>
  <rect x="0" y="544" width="800" height="1" fill="#6D7839" opacity="0.18"/>
  <g opacity="0.75">
    <rect x="150" y="562" width="20" height="20" rx="5" fill="#6D7839"/>
    <rect x="186" y="562" width="20" height="20" rx="5" fill="#456CAB"/>
    <rect x="222" y="562" width="20" height="20" rx="5" fill="#EEC145"/>
    <rect x="258" y="562" width="20" height="20" rx="5" fill="#528C54"/>
  </g>
</svg>
